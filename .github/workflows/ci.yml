name: CI

# CI leve: lint, smoke de import, testes unitarios sem dependencias pesadas
# (sem torch/chromadb) e varredura de segredos. Nao treina modelos nem roda o
# pipeline GPVS completo; isso e feito localmente (ver docs/comandos.md).

on:
  push:
    branches: ["main", "auditoria-integridade-academica"]
  pull_request:
  workflow_dispatch:

jobs:
  testes-leves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias de dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Varredura de segredos
        run: |
          achados="$(grep -rnE "(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{35})" \
              --include="*.py" --include="*.md" --include="*.json" \
              --include="*.yml" --include="*.yaml" --include="*.toml" \
              --exclude-dir=".git" --exclude-dir=".venv" \
              --exclude-dir=".codex-remote-attachments" . || true)"
          if [ -n "$achados" ]; then
            echo "$achados"
            echo "::error::Possivel segredo commitado."; exit 1
          fi
          echo "OK - nenhum segredo aparente."

      - name: Smoke de import (modulos leves)
        run: |
          python -c "import src.core.config, src.core.utils, src.conhecimento.indice_lexical, src.conhecimento.memoria_persistente, src.conhecimento.multiagente, src.ml.dados_gpvs, src.ml.pipeline, src.ml.proveniencia, src.ml.resultados; print('import OK')"

      - name: Conferir selecao do CI por marcadores
        run: |
          python -m pytest --collect-only -q -m "not pesado" > /tmp/ci-tests.txt
          cat /tmp/ci-tests.txt
          for alvo in \
            tests/test_dados_gpvs_canonico.py \
            tests/test_publicacao_comparacao.py \
            tests/test_pipeline_canonico.py \
            tests/test_resultados_canonicos.py \
            tests/test_proveniencia.py \
            tests/test_confiabilidade_componentes.py \
            tests/test_artefatos_protegidos.py \
            tests/test_auditar_resultados.py \
            tests/test_webapp.py \
            tests/test_recuperacao_hibrida.py \
            tests/test_chamadas_dos_scripts.py
          do
            grep -q "$alvo" /tmp/ci-tests.txt || {
              echo "::error::$alvo ficou fora da selecao do CI"; exit 1;
            }
          done

      # O piso de 60% foi medido, nao arbitrado: a selecao "not pesado" SEM
      # torch cobria 65% de src/ em 2026-09-03. O piso existe para impedir
      # regressao, nao para premiar cobertura -- suba-o quando a folga crescer.
      - name: Testes unitarios nao pesados (com cobertura)
        run: |
          python -m pytest -p no:cacheprovider -q -W ignore -m "not pesado" \
            --cov=src --cov-report=term --cov-report=xml --cov-fail-under=60

      # Confere que cada artefato publicado bate com o hash gravado no seu
      # manifesto. Nao treina nem le dados brutos, entao roda no job leve.
      # Sem isto, divergencia entre manifesto e artefato chegava ao main sem
      # ninguem ver -- so era detectada quando alguem rodava o script no PC.
      - name: Auditoria dos artefatos publicados
        run: python scripts/auditar_resultados.py

      # BLOQUEANTE e deliberadamente estreito: so nomes que nao existem.
      # F821 undefined name / F822 undefined em __all__ / F823 uso antes da
      # atribuicao local. Nao sao questao de estilo -- sao NameError em runtime.
      #
      # Mantem erros de nome em runtime fora do main mesmo quando o lint geral
      # permanece informativo.
      - name: Nomes indefinidos (bloqueante)
        run: ruff check --select F821,F822,F823 src tests scripts

      - name: Lint geral (ruff, nao bloqueante)
        continue-on-error: true
        run: ruff check src tests scripts || true

  # ==========================================================================
  # Job separado porque instala torch (~200 MB) e nao deve atrasar o feedback
  # rapido do job leve. NAO treina o pipeline nem le dataset bruto: instancia
  # as duas arquiteturas canonicas em dados artificiais pequenos.
  #
  # Deliberadamente NAO usa mock de torch: mockar torch testaria o mock.
  # ==========================================================================
  contrato-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache do wheel de torch
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-torch-cpu-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Instalar dev + torch CPU
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Contrato Denso e AE-LSTM (torch real, dados de brinquedo)
        run: |
          python -m pytest -p no:cacheprovider -q -W ignore \
            tests/test_torch_smoke.py tests/test_modelos_autoencoder_canonicos.py -m "not pesado"
