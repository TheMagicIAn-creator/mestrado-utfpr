name: CI

# CI leve: lint, smoke de import, testes unitarios sem dependencias pesadas
# (sem torch/chromadb) e varredura de segredos. Nao treina modelos nem roda o
# pipeline pesado; isso e feito localmente (ver docs/comandos.md).

on:
  push:
    branches: ["main", "auditoria-integridade-academica"]
  pull_request:
  workflow_dispatch:

jobs:
  testes-leves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias de dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Varredura de segredos
        run: |
          achados="$(grep -rnE "(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{35})" \
              --include="*.py" --include="*.md" --include="*.json" \
              --include="*.yml" --include="*.yaml" --include="*.toml" \
              --exclude-dir=".git" --exclude-dir=".venv" \
              --exclude-dir=".codex-remote-attachments" . || true)"
          if [ -n "$achados" ]; then
            echo "$achados"
            echo "::error::Possivel segredo commitado."; exit 1
          fi
          echo "OK - nenhum segredo aparente."

      - name: Smoke de import (modulos leves)
        run: |
          python -c "import src.core.config, src.core.utils, src.conhecimento.indice_lexical, src.conhecimento.memoria_persistente, src.conhecimento.multiagente, src.ml.split_temporal, src.ml.proveniencia; print('import OK')"

      - name: Conferir selecao do CI por marcadores
        run: |
          python -m pytest --collect-only -q -m "not pesado" > /tmp/ci-tests.txt
          cat /tmp/ci-tests.txt
          for alvo in \
            tests/test_escore_anomalia.py \
            tests/test_limiar.py \
            tests/test_smd.py \
            tests/test_ae_lstm_temporal.py \
            tests/test_comparacao_macro.py \
            tests/test_proveniencia.py
          do
            grep -q "$alvo" /tmp/ci-tests.txt || {
              echo "::error::$alvo ficou fora da selecao do CI"; exit 1;
            }
          done

      - name: Testes unitarios nao pesados
        run: |
          python -m pytest -p no:cacheprovider -q -W ignore -m "not pesado"

      # BLOQUEANTE e deliberadamente estreito: so nomes que nao existem.
      # F821 undefined name / F822 undefined em __all__ / F823 uso antes da
      # atribuicao local. Nao sao questao de estilo -- sao NameError em runtime.
      #
      # Existe porque avaliar_classificador_pv chamava Path() sem importar
      # pathlib e foi para o main: o teste da ferramenta so checava o
      # ROTEAMENTO, nunca executava a funcao, e o lint geral abaixo e
      # `continue-on-error` com `|| true`, entao nunca reprovou nada.
      - name: Nomes indefinidos (bloqueante)
        run: ruff check --select F821,F822,F823 src tests scripts

      - name: Lint geral (ruff, nao bloqueante)
        continue-on-error: true
        run: ruff check src tests scripts || true
