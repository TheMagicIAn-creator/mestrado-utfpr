name: CI

# CI leve: lint, smoke de import, testes unitarios sem dependencias pesadas
# (sem torch/chromadb) e varredura de segredos. Nao treina modelos nem roda o
# pipeline pesado; isso e feito localmente (ver docs/comandos.md).

on:
  push:
    branches: ["main", "auditoria-integridade-academica"]
  pull_request:
  workflow_dispatch:

jobs:
  testes-leves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias de dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Varredura de segredos
        run: |
          achados="$(grep -rnE "(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{35})" \
              --include="*.py" --include="*.md" --include="*.json" \
              --include="*.yml" --include="*.yaml" --include="*.toml" \
              --exclude-dir=".git" --exclude-dir=".venv" \
              --exclude-dir=".codex-remote-attachments" . || true)"
          if [ -n "$achados" ]; then
            echo "$achados"
            echo "::error::Possivel segredo commitado."; exit 1
          fi
          echo "OK - nenhum segredo aparente."

      - name: Smoke de import (modulos leves)
        run: |
          python -c "import src.core.config, src.core.utils, src.conhecimento.indice_lexical, src.conhecimento.memoria_persistente, src.conhecimento.multiagente, src.ml.split_temporal, src.ml.proveniencia; print('import OK')"

      - name: Testes unitarios leves (sem torch/chromadb)
        run: |
          python -m pytest -p no:cacheprovider -q -W ignore \
            tests/test_consistencia_docs.py \
            tests/test_formatacao_estilo.py \
            tests/test_comparacao_literatura.py \
            tests/test_inteligencia_agente.py \
            tests/test_split_temporal.py \
            tests/test_proveniencia.py \
            tests/test_pipeline_stale.py \
            tests/test_caminhos.py \
            tests/test_metricas.py \
            tests/test_abordagens.py \
            tests/test_confirmacao_destrutiva.py \
            tests/test_logs.py \
            tests/test_memoria_separada.py \
            tests/test_web_confianca.py \
            tests/test_index_lock.py \
            tests/test_classificador_infer.py \
            tests/test_classificador_tools.py \
            tests/test_retrieval_metrics.py \
            tests/test_embeddings.py \
            tests/test_provedores_leves.py \
            tests/test_indice_lexical.py \
            tests/test_memoria_persistente.py \
            tests/test_multiagente.py \
            tests/test_exec_isolado.py \
            tests/test_seguranca.py \
            tests/test_protocolos_artigos.py \
            tests/test_interface_minimalista.py \
            tests/test_inventario_vault.py

      - name: Lint (ruff, nao bloqueante)
        continue-on-error: true
        run: ruff check src tests scripts || true
