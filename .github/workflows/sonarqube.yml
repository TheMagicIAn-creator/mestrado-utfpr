name: SonarQube

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Analise e quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache do wheel de torch
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-sonar-torch-cpu-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Instalar dependencias de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Gerar cobertura Python
        run: |
          python -m pytest -p no:cacheprovider -q -W ignore -m "not pesado" \
            --cov=src --cov=scripts --cov-report=xml:coverage.xml --cov-report=term

      - name: Analisar e aguardar quality gate
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          skipSignatureVerification: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
