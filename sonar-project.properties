sonar.projectKey=TheMagicIAn-creator_mestrado-utfpr
sonar.organization=themagician-creator
sonar.projectName=mestrado-utfpr
sonar.host.url=https://sonarcloud.io

sonar.sources=src,scripts
sonar.tests=tests
sonar.test.inclusions=tests/test_*.py
sonar.python.version=3.13
sonar.sourceEncoding=UTF-8

# Dados, publicacoes cientificas, indices reconstruiveis e bibliotecas
# vendorizadas nao constituem codigo-fonte analisavel.
sonar.exclusions=dados/**,resultados/**,artefatos/**,base_conhecimento/**,literatura/**,notas/**,src/interface/**,src/webapp/static/vendor/**,**/__pycache__/**
sonar.cpd.exclusions=src/webapp/static/vendor/**

# A aplicacao JavaScript ainda nao possui harness de cobertura. Ela permanece
# sob analise estatica, mas nao recebe uma porcentagem artificial de cobertura.
sonar.coverage.exclusions=src/webapp/static/**,src/webapp/templates/**
sonar.python.coverage.reportPaths=coverage.xml

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
